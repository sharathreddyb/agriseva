spring.application.name=agriseva-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agriseva}
spring.datasource.username=${DATABASE_USERNAME:agriseva_user}
spring.datasource.password=${DATABASE_PASSWORD:agriseva_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true